{% extends "base.html" %}
{% import "macros.html" as macros %}
{% block content %}
<div class="boxed-panel">
  <h2 class="events-heading">Prossimi Eventi a Milano</h2>
</div>

{%- set events = load_data(path="data/events.json") %}
<div class="event-list">
  {%- for event in events %}
  {{ macros::event(event=event) }}
  {%- endfor %}
</div>
{% endblock %}
